services:
  inference:
    image: roboflow/roboflow-inference-server-gpu:latest
    container_name: rummikub-inference
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - roboflow-model-cache:/tmp:rw
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  roboflow-model-cache:
    name: rummikub-roboflow-model-cache
